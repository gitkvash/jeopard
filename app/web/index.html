<!DOCTYPE html>
<html lang="ka">
<head>
  <!--
    Replaced by the value of `flutter build --base-href`; must start and end
    with a slash.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="ჯეოპარდი — ღილაკზე დაჭერით ნათამაშები ვიქტორინა">

  <!-- Dark from the first byte: without this the browser paints a white page
       before any CSS lands, which on a phone reads as a flash. -->
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#05070F">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ჯეოპარდი">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ჯეოპარდი</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Startup order matters more than total bytes here. The engine cannot paint a
    single Georgian glyph until it has the asset manifest, the font manifest and
    the font itself, and it only asks for them after main.dart.js has parsed.
    Preloading puts those four requests in flight immediately, in parallel with
    the engine download, so text appears as soon as the framework is ready
    instead of one round trip later.
  -->
  <link rel="preload" href="assets/AssetManifest.bin.json" as="fetch" crossorigin>
  <link rel="preload" href="assets/FontManifest.json" as="fetch" crossorigin>
  <link rel="preload" href="assets/assets/fonts/NotoSansGeorgian-Regular.ttf" as="fetch" crossorigin>
  <link rel="preload" href="assets/assets/fonts/RobotoLatin-Regular.ttf" as="fetch" crossorigin>

  <style>
    /* The splash carries the same font as the app, which also warms the HTTP
       cache for the copy the engine is about to ask for. */
    @font-face {
      font-family: 'NotoSansGeorgian';
      src: url('assets/assets/fonts/NotoSansGeorgian-Bold.ttf') format('truetype');
      font-weight: 700;
      font-display: swap;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #05070F;
      overflow: hidden;
    }

    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      /* The same stage the app opens onto: light pooled above, dark at the
         edges. The handover is then invisible. */
      background:
        radial-gradient(115% 85% at 50% 0%, #0B1024 0%, #05070F 72%),
        #05070F;
      /* Faded out rather than removed on the first frame, so the handover to
         the real UI is not a jump cut. */
      transition: opacity 220ms ease-out;
      z-index: 10;
    }

    #splash.done {
      opacity: 0;
      pointer-events: none;
    }

    #splash .title {
      font-family: 'NotoSansGeorgian', 'Sylfaen', 'Noto Sans Georgian', sans-serif;
      font-weight: 700;
      font-size: 40px;
      letter-spacing: 4px;
      color: #FFE29A;
      text-shadow: 0 3px 8px rgba(0,0,0,.7), 0 0 34px rgba(242,193,78,.4);
    }

    /* Brass rules above and below the title: the app announces a game. */
    #splash .rule {
      width: 210px; height: 2px;
      background: linear-gradient(90deg, rgba(138,106,42,0), #8A6A2A, rgba(138,106,42,0));
    }

    #splash .bar {
      width: 120px;
      height: 3px;
      border-radius: 999px;
      background-color: #171D33;
      overflow: hidden;
    }

    #splash .bar span {
      display: block;
      width: 40%;
      height: 100%;
      border-radius: 999px;
      background-color: #F2C14E;
      animation: slide 1.1s ease-in-out infinite;
    }

    @keyframes slide {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(250%); }
    }

    @media (prefers-reduced-motion: reduce) {
      #splash .bar span { animation: none; width: 100%; opacity: 0.5; }
      #splash { transition: none; }
    }
  </style>
</head>
<body>
  <div id="splash">
    <div class="rule"></div>
    <div class="title">ჯეოპარდი</div>
    <div class="rule"></div>
    <div class="bar"><span></span></div>
  </div>

  <script>
    // The engine fires this once the framework has painted; anything earlier
    // (load, DOMContentLoaded) would uncover an empty canvas.
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (!splash) return;
      splash.classList.add('done');
      splash.addEventListener('transitionend', function () { splash.remove(); });
      // Belt and braces: if the transition never fires, do not leave the
      // splash sitting on top of the app.
      setTimeout(function () { if (splash.parentNode) splash.remove(); }, 600);
      document.body.style.overflow = '';
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>

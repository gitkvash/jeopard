# Postgres for the Jeopard backend.
#   docker compose up -d
services:
  db:
    image: postgres:17-alpine
    container_name: jeopard-db
    environment:
      POSTGRES_DB: jeopard
      POSTGRES_USER: jeopard
      POSTGRES_PASSWORD: jeopard
    ports:
      - "5434:5432"   # 5432: native PostgreSQL 18; 5433: the linkup project's Postgres
    volumes:
      - jeopard-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jeopard -d jeopard"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  jeopard-pgdata:

spring:
  application:
    name: jeopard-backend
  datasource:
    # Overridden by SPRING_DATASOURCE_* in a deployment; the defaults are the
    # local Docker Postgres on 5433 (5432 belongs to a native install here).
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/jeopard}
    username: ${SPRING_DATASOURCE_USERNAME:jeopard}
    password: ${SPRING_DATASOURCE_PASSWORD:jeopard}
    hikari:
      # Every room shares this pool, and every buzz, join and snapshot needs a
      # connection out of it. The transactions are short -- a state flip and a
      # broadcast -- so the pool is sized for how many rooms can be mid-action
      # at once rather than for how many people are playing. The default of ten
      # is a single-room number; this is a few rooms' worth, and still an order
      # of magnitude under a stock Postgres max_connections.
      maximum-pool-size: ${JEOPARD_DB_POOL:20}
      data-source-properties:
        # Set on the driver rather than in the URL so it survives whatever
        # SPRING_DATASOURCE_URL a deployment supplies. Turns each JDBC batch
        # into one multi-row INSERT instead of one statement per row -- the
        # other half of hibernate.jdbc.batch_size below.
        reWriteBatchedInserts: true
  mvc:
    problemdetails:
      # Every refusal in this app carries a sentence meant to be read: "another
      # team buzzed first", "that player name is taken", "game is mid-clue; join
      # between clues". Without this, Spring answers a ResponseStatusException
      # with {"timestamp","status","error","path"} and drops the sentence, so the
      # client -- which looks for "detail" and falls back to printing the raw
      # body -- showed the player that JSON blob instead. RFC 9457 puts the
      # reason in "detail", which is the field the client was already reading.
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate      # Flyway owns the schema
    properties:
      hibernate.jdbc.time_zone: UTC
      # Ids are hand-assigned (no IDENTITY anywhere), so Hibernate is free to
      # batch. Without this every insert is its own round trip, which is what
      # made seeding 2,760 clues and assembling a random packet -- 117 rows
      # while the host watches a spinner -- cost a round trip per row.
      hibernate.jdbc.batch_size: 100
      hibernate.order_inserts: true
      hibernate.order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  # Behind a TLS-terminating proxy Spring must trust X-Forwarded-Proto, or it
  # believes the request arrived over plain http -- which breaks the WebSocket
  # handshake and any absolute URL it builds.
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:none}

jeopard:
  seed:
    resource: classpath:pilot.json
  cors:
    # Flutter web dev server picks a random port, so allow any localhost origin.
    # Comma-separated (not a YAML list) so @Value can bind it to String[].
    # A deployment serves the app from the same origin as the API and needs no
    # CORS at all; this stays for native builds pointed at it directly.
    allowed-origin-patterns: ${JEOPARD_CORS_ORIGINS:http://localhost:*,http://127.0.0.1:*}
  ws:
    # Mobile clients send no Origin header at all, so "*" is the permissive
    # default; a deployment should pin this to its own origin.
    allowed-origin-patterns: ${JEOPARD_WS_ORIGINS:*}
  board-cache:
    # Boards held in memory, least recently used evicted first. The working set
    # is one board per game in progress; the bound exists because generated
    # packages mint rounds that one game plays and nothing ever asks for again.
    size: ${JEOPARD_BOARD_CACHE:256}
  buzz-timer:
    # Threads shared by every room's automatic buzzer. See SchedulingConfig.
    threads: ${JEOPARD_BUZZ_TIMER_THREADS:4}
  limits:
    # Creating a game is unauthenticated by design -- a host just opens the app.
    # That makes it the one endpoint worth a ceiling, so a public URL cannot be
    # used to fill the database. Games created per hour, per client address.
    games-per-hour-per-ip: ${JEOPARD_GAMES_PER_HOUR:30}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    ge.jeopard: DEBUG
